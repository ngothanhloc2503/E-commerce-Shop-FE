<div class="mb-4">
    <h2 class="mb-4 text-xl font-extrabold leading-none tracking-tight text-gray-900 md:text-4xl lg:text-3xl dark:text-white">Sales Report</h2>
</div>

<div class="border-b border-gray-200 dark:border-gray-700">
    <ul class="flex flex-wrap -mb-px text-sm font-medium text-center" id="sales-report-tab" data-tabs-toggle="#sales-report-tab-content" role="tablist">
        <li class="me-2" role="presentation">
            <button class="inline-block p-4 border-b-2 rounded-t-lg" id="date-tab" data-tabs-target="#date" type="button" role="tab" aria-controls="date" aria-selected="false"
            (click)="hiddenCustomDateRangeForm()">Sales by Date</button>
        </li>
        <li class="me-2" role="presentation">
            <button class="inline-block p-4 border-b-2 rounded-t-lg hover:text-gray-600 hover:border-gray-300 dark:hover:text-gray-300" id="category-tab" data-tabs-target="#category" type="button" role="tab" aria-controls="category" aria-selected="false"
            (click)="hiddenCustomDateRangeForm()">Sales by Category</button>
        </li>
        <li class="me-2" role="presentation">
            <button class="inline-block p-4 border-b-2 rounded-t-lg hover:text-gray-600 hover:border-gray-300 dark:hover:text-gray-300" id="product-tab" data-tabs-target="#product" type="button" role="tab" aria-controls="product" aria-selected="false"
            (click)="hiddenCustomDateRangeForm()">Sales by Product</button>
        </li>
    </ul>
</div>

<div id="sales-report-tab-content">
    <!-- Tab Sales by Date -->
    <div class="hidden p-4 rounded-lg w-full mx-auto" id="date" role="tabpanel" aria-labelledby="date-tab">
        <div class="flex flex-wrap">
            <button (click)="getSalesReportByDate('last-7-days')" type="button" class="text-white w-36 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Last 7 Days</button>
            <button (click)="getSalesReportByDate('last-28-days')" type="button" class="text-white w-36 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Last 28 Days</button>
            <button (click)="getSalesReportByDate('last-6-months')" type="button" class="text-white w-36 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Last 6 Months</button>
            <button (click)="getSalesReportByDate('last-year')" type="button" class="text-white w-36 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Last Year</button>
            <button type="button" (click)="showCustomDateRangeForm('date')" class="text-white w-auto bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800 text-gray-900 dark:text-white">Custom Date Range</button>
        </div>
    </div>

    <!-- Tab Sales by Category -->
    <div class="hidden p-4 rounded-lg w-full mx-auto" id="category" role="tabpanel" aria-labelledby="category-tab">
        <div class="flex flex-wrap">
            <button type="button" (click)="getSalesReportByCategory('last-7-days')" class="text-white w-36 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Last 7 Days</button>
            <button type="button" (click)="getSalesReportByCategory('last-28-days')" class="text-white w-36 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Last 28 Days</button>
            <button type="button" (click)="getSalesReportByCategory('last-6-months')" class="text-white w-36 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Last 6 Months</button>
            <button type="button" (click)="getSalesReportByCategory('last-year')" class="text-white w-36 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Last Year</button>
            <button type="button" (click)="showCustomDateRangeForm('category')" class="text-white w-auto bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Custom Date Range</button>
        </div>
    </div>

    <!-- Tab Sales by Product -->
    <div class="hidden p-4 rounded-lg w-full mx-auto" id="product" role="tabpanel" aria-labelledby="product-tab">
        <div class="flex flex-wrap">
            <button type="button" (click)="getSalesReportByProduct('last-7-days')" class="text-white w-36 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Last 7 Days</button>
            <button type="button" (click)="getSalesReportByProduct('last-28-days')" class="text-white w-36 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Last 28 Days</button>
            <button type="button" (click)="getSalesReportByProduct('last-6-months')" class="text-white w-36 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Last 6 Months</button>
            <button type="button" (click)="getSalesReportByProduct('last-year')" class="text-white w-36 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Last Year</button>
            <button type="button" (click)="showCustomDateRangeForm('product')" class="text-white w-auto bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Custom Date Range</button>
        </div>
    </div>
</div>

<form id="customDateRangeForm" class="m-4 mt-0 inline dark:text-white hidden">
    <div class="inline">
        From date:
        &nbsp;
        <input type="date" id="fromDate" name="fromDate" class="from-date text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" />
    </div>
    &nbsp;
    <div class="inline">
        To date:
        &nbsp;
        <input type="date" id="toDate" name="toDate" class="to-date text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" />
    </div>
    &nbsp;
    <button type="button" (click)="getSalesReportByDateRange()" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Apply</button>
</form>

<div id="salesReportChart" class="m-4"></div>



<div class="tableTotalAmount relative overflow-x-auto shadow-md sm:rounded-lg">
    <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
            <tr>
                <th scope="col" class="px-6 py-3">
                    Total Gross Sales
                </th>
                <th scope="col" class="px-6 py-3">
                    Total Net Sales
                </th>
                <th scope="col" class="px-6 py-3">
                    Avg. Gross Sales
                </th>
                <th scope="col" class="px-6 py-3">
                    Avg. Net Sales
                </th>
                <th scope="col" class="px-6 py-3 totalItemCount">
                </th>
            </tr>
        </thead>
        <tbody>
            <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700">
                <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
                    {{ totalGrossSales }}
                </th>
                <td class="px-6 py-4">
                    {{ totalNetSales }}
                </td>
                <td class="px-6 py-4">
                    {{ avgGrossSales }}
                </td>
                <td class="px-6 py-4">
                    {{ avgNetSales }}
                </td>
                <td class="px-6 py-4 totalItemCount">
                    {{ totalItemCount }}
                </td>
            </tr>
        </tbody>
    </table>
</div>
