<div class="mx-auto max-w-screen-xl px-4 2xl:px-0">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-bold text-gray-900 dark:text-white">
            Address Book
        </h2>

        <a routerLink="/address-book/new"
            class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow transition">
            <i class="fa-solid fa-plus"></i>
            Add Address
        </a>
    </div>

    <!-- Grid -->
    <div class="grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <!-- Primary Address -->
        <div [ngClass]="userPrimaryAddressAsDefault ? 'ring-2 ring-yellow-400 bg-yellow-50 dark:bg-yellow-900/20' : ''"
            class="relative w-full border border-gray-200 rounded-2xl shadow-sm hover:shadow-lg transition dark:border-gray-700 bg-white dark:bg-gray-800">

            <!-- Badge -->
            <span class="absolute top-3 right-3 text-xs bg-yellow-400 text-black px-2 py-1 rounded"
                *ngIf="userPrimaryAddressAsDefault">
                Default
            </span>

            <div class="p-5">
                <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-2">
                    Primary Address
                </h3>

                <p class="text-gray-900 dark:text-white text-base leading-relaxed">
                    {{ getAddress(user) }}
                </p>

                <!-- Actions -->
                <div class="flex gap-2 mt-5">
                    <button *ngIf="!userPrimaryAddressAsDefault" (click)="setDefault(0)"
                        class="flex-1 text-sm bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg transition">
                        Set Default
                    </button>

                    <a href="/account?redirect=address-book"
                        class="flex-1 text-sm text-white bg-gray-500 hover:bg-gray-700 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-900 dark:text-gray-200 py-2 rounded-lg transition text-center">
                        Edit
                    </a>
                </div>
            </div>
        </div>

        <!-- Address List -->
        <div *ngFor="let address of addressBook; index as idx"
            [ngClass]="address.defaultForShipping ? 'ring-2 ring-yellow-400 bg-yellow-50 dark:bg-yellow-900/20' : ''"
            class="relative w-full border border-gray-200 rounded-2xl shadow-sm hover:shadow-lg transition dark:border-gray-700 bg-white dark:bg-gray-800">

            <!-- Default badge -->
            <span *ngIf="address.defaultForShipping"
                class="absolute top-3 right-3 text-xs bg-yellow-400 text-black px-2 py-1 rounded">
                Default
            </span>

            <!-- Delete -->
            <button *ngIf="!address.defaultForShipping" (click)="deleteAddress(address.id)"
                class="absolute top-3 left-3 text-red-500 p-2 rounded-full transition duration-200 ease-in-out hover:bg-red-600 hover:text-white hover:scale-110 hover:shadow-lg transition">
                <i class="fa-solid fa-trash"></i>
            </button>

            <div class="p-5" [class.pl-12]="!address.defaultForShipping">
                <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-2">
                    Address #{{ idx + 1 }}
                </h3>

                <p class="text-gray-900 dark:text-white text-base leading-relaxed">
                    {{ getAddress(address) }}
                </p>

                <!-- Actions -->
                <div class="flex gap-2 mt-5">

                    <button *ngIf="!address.defaultForShipping" (click)="setDefault(address.id)"
                        class="flex-1 text-sm bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg transition">
                        Set Default
                    </button>

                    <button (click)="editAddressWithId(address.id)"
                        class="flex-1 text-sm text-white bg-gray-500 hover:bg-gray-700 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-900 dark:text-gray-200 py-2 rounded-lg transition text-center">
                        Edit
                    </button>

                </div>
            </div>
        </div>

    </div>
</div>
