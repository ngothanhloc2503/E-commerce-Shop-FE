@if (isVisible()) {
    <div id="return-order-request-modal"
        class="overflow-x-hidden overflow-y-auto fixed inset-0 z-50 outline-none focus:outline-none justify-center items-center flex">

        <div class="relative p-4 w-full max-w-2xl max-h-full">
            <!-- Modal content -->
            <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">

                <!-- Modal header -->
                <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                    <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
                        Return Order ID #{{ orderId() }}
                    </h3>
                    <button type="button" (click)="closeModal()"
                        class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
                        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                        </svg>
                        <span class="sr-only">Close modal</span>
                    </button>
                </div>

                <!-- Modal body -->
                <div class="p-4 dark:text-white">
                    <h3 class="font-medium mb-3">Reason:</h3>

                    <div class="flex flex-col gap-2 mb-4">
                        @for (r of reasons; track r.id) {
                            <div class="flex flex-row items-center">
                                <input type="radio"
                                    [id]="r.id"
                                    name="returnReason"
                                    [value]="r.value"
                                    [checked]="selectedReason() === r.value"
                                    (change)="onReasonChange(r.value)"
                                    class="my-auto me-2" />
                                <label [for]="r.id">{{ r.label }}</label>
                            </div>
                        }
                    </div>

                    <textarea class="text-gray-900 w-full rounded-lg border border-gray-300 p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-600 dark:border-gray-500 dark:text-white"
                        id="returnNote"
                        rows="4"
                        maxlength="120"
                        placeholder="Additional information"
                        [ngModel]="note()"
                        (ngModelChange)="note.set($event)"
                        [ngModelOptions]="{ standalone: true }">
                    </textarea>
                </div>

                <!-- Modal footer -->
                <div class="flex justify-end p-4 md:p-5 border-t border-gray-200 rounded-b dark:border-gray-600">
                    <button (click)="closeModal()" type="button"
                        class="py-2.5 px-5 text-sm font-medium text-white focus:outline-none bg-red-500 rounded-lg border border-gray-200
                               hover:bg-red-600 focus:z-10 focus:ring-4 focus:ring-red-600
                               dark:focus:ring-red-700 dark:bg-red-600 dark:border-gray-600 dark:hover:text-white dark:hover:bg-red-700">
                        Cancel
                    </button>

                    <button (click)="sendReturnRequest()" type="button"
                        [disabled]="isSubmitting() || !selectedReason()"
                        class="text-white bg-green-600 hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300
                               dark:focus:ring-green-800 font-medium rounded-lg text-sm inline-flex items-center px-5 py-2.5 ms-3 text-center
                               disabled:opacity-50 disabled:cursor-not-allowed">
                        @if (isSubmitting()) {
                            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                            </svg>
                            Sending…
                        } @else {
                            Send Request
                        }
                    </button>
                </div>
            </div>
        </div>
    </div>
}
