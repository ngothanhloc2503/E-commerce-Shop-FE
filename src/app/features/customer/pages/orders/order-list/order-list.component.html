<div class="mb-4 text-center justify-center">
    <h2 class="text-xl font-extrabold leading-none tracking-tight text-gray-900 md:text-4xl lg:text-5xl dark:text-white">My Orders</h2>
</div>

<div class="relative overflow-x-auto shadow-md sm:rounded-lg">
    <table class="w-full text-sm text-left rtl:text-right text-gray-600 dark:text-gray-400">
        <thead class="text text-gray-900 uppercase bg-blue-200 dark:bg-gray-700 dark:text-gray-400">
            <tr>
                <th scope="col" class="px-6 py-3">
                    <button type="button" (click)="sort('id')">
                        ID
                        <i *ngIf="sortField == 'id' && sortDir == 'desc'" class="fa-solid fa-sort-up"></i>
                        <i *ngIf="sortField == 'id' && sortDir == 'asc'" class="fa-solid fa-sort-down"></i>
                    </button>
                </th>
                <th scope="col" class="px-6 py-3">
                    <button type="button" (click)="sort('orderTime')">
                        Order Time
                        <i *ngIf="sortField == 'orderTime' && sortDir == 'desc'" class="fa-solid fa-sort-up"></i>
                        <i *ngIf="sortField == 'orderTime' && sortDir == 'asc'" class="fa-solid fa-sort-down"></i>
                    </button>
                </th>
                <th scope="col" class="px-6 py-3" style="text-transform: capitalize;">
                    Product
                </th>
                <th scope="col" class="px-6 py-3">
                    <button type="button" (click)="sort('total')">
                        Total
                        <i *ngIf="sortField == 'total' && sortDir == 'desc'" class="fa-solid fa-sort-up"></i>
                        <i *ngIf="sortField == 'total' && sortDir == 'asc'" class="fa-solid fa-sort-down"></i>
                    </button>
                </th>
                <th scope="col" class="px-6 py-3">
                    <button type="button" (click)="sort('status')">
                        Status
                        <i *ngIf="sortField == 'status' && sortDir == 'desc'" class="fa-solid fa-sort-up"></i>
                        <i *ngIf="sortField == 'status' && sortDir == 'asc'" class="fa-solid fa-sort-down"></i>
                    </button>
                </th>
                <th scope="col" class="px-6 py-3" style="text-transform: capitalize;">
                    Action
                </th>
            </tr>
        </thead>

        <tbody *ngFor="let order of listOrders">
            <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
                <td class="px-6 py-4">
                    {{ order.id }}
                </td>
                <td class="px-6 py-4">
                    {{ order.orderTime | date:'medium' }}
                </td>
                <td class="px-6 py-4">
                    <ul class="list-disc" *ngFor="let orderDetail of order.orderDetails">
                        <li>{{ getShortName(orderDetail.productName) }}</li>
                    </ul>
                </td>
                <td class="px-6 py-4">
                    {{ settingService.getFormatMoney(order.total) }}
                </td>
                <td class="px-6 py-4">
                    {{ order.status }}
                </td>
                <td class="px-6 py-4">
                    <button type="button" (click)="openOrderDetailsModal(order)" 
                    class="font-medium text-blue-600 dark:text-blue-500 hover:underline">
                        <span class="sr-only">View details of this order</span>
                        <i class="fa-solid fa-file-invoice fa-xl"></i>
                    </button>
                    &nbsp;
                    <button *ngIf="isReturnable(order.orderTrack)" (click)="openReturnOrderRequestModal(order)" type="button" 
                    class="font-medium text-blue-600 dark:text-blue-500 hover:underline">
                        <span class="sr-only">Send request to return this order</span>
                        <i class="fa-solid fa-arrow-rotate-left fa-xl"></i>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <nav class="flex items-center flex-column flex-wrap md:flex-row justify-between pt-4" aria-label="Table navigation">
        <span class="text-sm font-normal text-gray-500 dark:text-gray-400 mb-4 md:mb-0 block w-full md:inline md:w-auto">Showing <span class="font-semibold text-gray-900 dark:text-white">{{ startCount }}-{{ endCount }}</span> of <span class="font-semibold text-gray-900 dark:text-white">{{ totalItems }} orders</span></span>

        <div class="flex items-center ms-auto me-2">
            <span class="text-sm font-medium dark:text-white">
                Orders per page: &nbsp; 
            </span>
            <select (change)="changePageSize($event)"
                class="h-8 text-sm pt-2 leading-none transition duration-75 border-gray-300 rounded-lg shadow-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-inset focus:ring-blue-500 dark:text-white dark:bg-gray-700 dark:border-gray-600 dark:focus:border-blue-500">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="-1">All</option>
            </select>
        </div>

        <ul class="inline-flex -space-x-px rtl:space-x-reverse text-sm h-8">
            <li>
                <button type="button" (click)="goToPage(1)" [class]="pageNum > 1 ? '' : 'disabled'" title="First" class="flex items-center justify-center px-3 h-8 ms-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-s-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
                    <span class="sr-only">First</span>
                    <i class="fa-solid fa-angles-left"></i>
                </button>
            </li>
            <li>
                <button type="button" (click)="goToPage(pageNum - 1)" [class]="pageNum > 1 ? '' : 'disabled'" title="Previous" class="flex items-center justify-center px-3 h-8 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
                    <span class="sr-only">Previous</span>
                    <i class="fa-solid fa-angle-left"></i>
                </button>
            </li>
            <li *ngIf="pageNum > 3">
                <button type="button" title="Previous" class="flex items-center justify-center px-3 h-8 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white" disabled>...</button>
            </li>
            <li *ngFor="let pageNumber of [].constructor(totalPages); let i = index">
                <button type="button" *ngIf="i + 1 != pageNum && pageNum - 4 < i && i < pageNum + 2" 
                    (click)="goToPage(i + 1)"
                    class="flex items-center justify-center px-3 h-8 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">{{ i + 1 }}</button>
                <button type="button" *ngIf="i + 1 == pageNum" aria-current="page" class="flex items-center justify-center px-3 h-8 text-blue-600 border border-gray-300 bg-blue-50 hover:bg-blue-100 hover:text-blue-700 dark:border-gray-700 dark:bg-gray-700 dark:text-white" disabled>{{i + 1}}</button>
            </li>
            <li *ngIf="pageNum + 2 < totalPages">
                <button type="button" title="Previous" class="flex items-center justify-center px-3 h-8 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white" disabled>...</button>
            </li>
            <li>
                <button type="button" (click)="goToPage(pageNum + 1)" [class]="pageNum < totalPages ? '' : 'disabled'" title="Next" class="flex items-center justify-center px-3 h-8 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
                    <span class="sr-only">Next</span>
                    <i class="fa-solid fa-angle-right"></i>
                </button>
            </li>
            <li>
                <button type="button" (click)="goToPage(totalPages)" [class]="pageNum < totalPages ? '' : 'disabled'" title="Last" class="flex items-center justify-center px-3 h-8 leading-tight text-gray-500 bg-white border border-gray-300 rounded-e-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
                    <span class="sr-only">Last</span>
                    <i class="fa-solid fa-angles-right"></i>
                </button>
            </li>
        </ul>
    </nav>
</div>

<app-order-details [isVisible]="showOrderDetailsModal" [order]="orderSelected" (closeModalEmitter)="closeModal()"></app-order-details>
<app-return-order-request [isVisible]="showReturnOrderRequestModal" [orderId]="orderSelected.id" (closeModalEmitter)="closeModal()" (returnRequestSuccessfulEmitter)="returnRequestSuccessful()"></app-return-order-request>
