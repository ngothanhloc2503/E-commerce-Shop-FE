<div class="flex h-screen justify-center items-center px-6 mt-[-72px] mx-auto lg:py-0">
    <div class="w-96 bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-700 dark:border-gray-700">
        <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
            <h2 class="w-full text-center text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
                Reset Password
            </h2>

            <div *ngIf="isSent" class="w-full p-4 rounded-lg text-white" [class]="getBgColor()">{{ message }}
                <a *ngIf="isSuccess" href="/sign-in" class="text-blue-600 font-bold underline">Sign In Now</a>
            </div>

            <form [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()">
                <div class="mb-4">
                    <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Email</label>
                    <span class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 dark:shadow-sm-light">{{ email }}</span>
                </div>

                <div class="mb-4">
                    <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Password</label>
                    <app-input [control]="password" [type]="'password'" [required]="true"></app-input>
                </div>

                <div class="mb-4">
                    <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Confirm Password</label>
                    <app-input [control]="confirmPassword" [type]="'password'" [required]="true"></app-input>
                </div>

                <button [disabled]="resetPasswordForm.invalid"
                type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800 disabled:bg-blue-500 disabled:dark:bg-blue-500">Reset Password</button>
            </form>
        </div>
    </div>
</div>
