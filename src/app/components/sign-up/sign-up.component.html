<div class="flex justify-center items-center px-6 pt-4 mx-auto">
    <div
        class="md:w-2/3 lg:w-1/2 bg-white rounded-lg shadow dark:border md:mt-0 xl:p-0 dark:bg-gray-700 dark:border-gray-700">
        <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
            <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
                Sign up and start shopping
            </h1>
            <form class="space-y-4 md:space-y-6" (ngSubmit)="signUp()" [formGroup]="registerForm" >
                <div class="grid md:grid-cols-2 md:gap-6">
                    <div class="relative z-0 w-full group">
                        <label for="firstName"
                            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">First name</label>
                        <app-input [control]="firstName" [type]="'text'" [required]="true"></app-input>
                    </div>
                    <div class="relative z-0 w-full group">
                        <label for="lastName" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Last
                            name</label>
                        <app-input [control]="lastName" [type]="'text'" [required]="true"></app-input>
                    </div>
                </div>

                <div class="mb-5">
                    <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Your
                        email</label>
                    <app-input [control]="email" [type]="'email'" [placeholder]="'Enter your email address'"
                        [required]="true"></app-input>
                </div>
                <div class="mb-5">
                    <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Your
                        password</label>
                    <app-input [control]="password" [type]="'password'" [required]="true"></app-input>
                </div>
                <div class="mb-5">
                    <label for="confirm-password"
                        class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Confirm password</label>
                    <app-input [control]="confirm_password" [type]="'password'" [required]="true"></app-input>
                </div>

                <div class="grid md:grid-cols-2 md:gap-6">
                    <div class="relative z-0 w-full group">
                        <label for="phoneNumber"
                            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Phone number</label>
                        <app-input [control]="phoneNumber" [type]="'text'" [required]="true"></app-input>
                    </div>
                    <div class="relative z-0 w-full group">
                        <label for="dateOfBirth"
                            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Date of birth</label>
                        <app-input [control]="birthOfDate" [type]="'date'" [required]="true"></app-input>
                    </div>
                </div>

                <div class="mb-5">
                    <label for="addressLine1" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Address Line 1</label>
                    <app-input [control]="addressLine1" [type]="'text'" [required]="true"></app-input>
                </div>
            
                <div class="mb-5">
                    <label for="addressLine2" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Address Line 2</label>
                    <app-input [control]="addressLine2" [type]="'text'"></app-input>
                </div>
            
                <div class="grid md:grid-cols-2 md:gap-6 mt-0">
                    <div class="relative z-0 w-full group">
                        <label for="country" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Country</label>
                        <select id="country" formControlName="country" (change)="getStateByCountryName()" class=" block bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                            <option *ngFor="let c of listCountries" value="{{ c.name }}">{{ c.name }}</option>
                        </select>
                    </div>
                    <div class="relative z-0 w-full group">
                        <label for="state" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">State</label>
                        <select id="state" formControlName="state" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                            <option *ngFor="let s of listStates" value="{{ s.name }}">{{ s.name }}</option>
                        </select>
                    </div>
                </div>
                <div class="grid md:grid-cols-2 md:gap-6 mt-0">
                    <div class="relative z-0 w-full mb-5 group">
                        <label for="city" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">City</label>
                        <app-input [control]="city" [type]="'text'"></app-input>
                    </div>
                    <div class="relative z-0 w-full mb-5 group">
                        <label for="postalCode" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Postal Code</label>
                        <app-input [control]="postalCode" [type]="'text'" [required]="true"></app-input>
                    </div>
                </div>

                <button type="submit" [disabled]="registerForm.invalid"
                    class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800 disabled:bg-blue-500 disabled:dark:bg-blue-500">
                    Sign Up
                </button>

                <div>
                    <span class="dark:text-white">Already have an account? <a routerLink="/sign-in" class="font-bold underline pt-2 px-3 text-blue-700 md:p-0">Sign In</a></span>
                </div>
            </form>
        </div>
    </div>
</div>
