<div class="flex h-screen justify-center items-center px-6 mt-[-72px] mx-auto lg:py-0">
    <div class="w-96 bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-700 dark:border-gray-700">
        <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
            <div class="relative text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
                <a href="/sign-in" class="absolute top-0 left-0" title="Back to sign In"><i class="fa-solid fa-arrow-left"></i></a>
                <h2 class="w-full text-center">Forgot Password</h2>
            </div>

            <div *ngIf="isSent" class="w-full p-4 rounded-lg text-white" [class]="getBgColor()">{{ message }}</div>

            <form [formGroup]="forgotPasswordForm" (ngSubmit)="forgotPassword()">
                <div class="mb-4">
                    <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Your email</label>
                    <app-input [control]="email" [type]="'email'" [required]="true"></app-input>
                </div>
                <button [disabled]="forgotPasswordForm.invalid"
                type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Send</button>
            </form>
        </div>
    </div>
</div>
