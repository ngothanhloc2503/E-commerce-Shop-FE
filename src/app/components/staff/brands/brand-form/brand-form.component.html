<div class="mb-4 text-center justify-center">
    <h2 class="mb-5 text-xl font-extrabold leading-none tracking-tight text-gray-900 md:text-4xl lg:text-5xl dark:text-white">Manage Brands | {{ title }}</h2>
</div>

<form class="max-w-md mx-auto" [formGroup]="brandForm" (ngSubmit)="saveBrand()">
    <input type="hidden" id="id" name="id" formControlName="id"/>
    <div class="mb-5">
        <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Brand Name:</label>
        <app-input [control]="name" [type]="'text'" [required]="true"></app-input>
    </div>
    
    <div class="z-0 w-full group">
        <label for="categories" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Select one or more categories:</label>
        <select id="categories" multiple formControlName="listCategoryIDs" 
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
            <option *ngFor="let cat of listCategories" name="categories" value="{{ cat.id }}">{{ cat.name }}</option>
        </select>
    </div>
    <div class="z-0 w-full mb-5 group">
        <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white" for="brand_logo">Upload file brand logo:</label>
        <img id='preview_logo' class="mx-auto mb-2 h-32 w-32 object-cover" src="{{ logoPreviewSrc }}" alt="Preview brand logo" />
        <input [required]="brandID == null" (change)="onSelectLogo($event)"
        class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400" aria-describedby="brand_logo" id="brand_logo" type="file">
        <p *ngIf="logo.errors?.['required']" class="text-center justify-center text-red-400">
            Field is required. A logo is useful to show brand.
        </p>
    </div>
    
    <div class="text-center justify-content-center">
        <button type="button" (click)="cancel()"
        class="text-white w-36 bg-red-700 hover:bg-red-800 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-red-600 dark:hover:bg-red-700 focus:outline-none dark:focus:ring-red-800">Cancel</button>
        <button type="submit" [disabled]="brandForm.invalid"
        class="text-white w-36 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Save</button>
    </div>
</form>
