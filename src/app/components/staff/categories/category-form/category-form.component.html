<div class="my-4 text-center justify-center">
    <h2 class="mb-5 text-xl font-extrabold leading-none tracking-tight text-gray-900 md:text-4xl lg:text-5xl dark:text-white">Manage Categories | {{ title }}</h2>
</div>
<form class="max-w-md mx-auto" [formGroup]="categoryForm" (ngSubmit)="saveCategory()">
    <input type="hidden" id="id" name="id" formControlName="id"/>
    <div class="mb-5">
        <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Category Name:</label>
        <app-input [control]="name" [type]="'text'" [required]="true"></app-input>
    </div>

    <div class="mb-5">
        <label for="description" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Description:</label>
        <textarea formControlName="description" required id="description"rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Write your thoughts here..."></textarea>
        <div *ngIf="description.touched || description.dirty">
            <p *ngIf="description.errors?.['required']" class="text-red-400">
                Field is required.
            </p>
        </div>
    </div>
    

    <div class="z-0 w-full group">
        <label for="parent" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Category Parent:</label>
        <select id="parent" formControlName="parentID" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
            <option value="0">No Parent</option>

            <option *ngFor="let cat of listCategories" value="{{ cat.id }}">{{ cat.name }}</option>
        </select>
    </div>
    <div class="z-0 w-full mt-5 mb-5 group">
        <label for="isEnabled" class="text-sm font-medium text-gray-900 dark:text-gray-300">Enabled: </label>
        <input id="isEnabled" type="checkbox" formControlName="enabled"
        class="ms-2 w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 dark:focus:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
    </div>
    <div class="z-0 w-full mb-5 group">
        <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white" for="category_img">Upload file category image:</label>
        <img id='preview_img' class="mx-auto mb-2 h-32 w-32 object-cover" src="{{ imagePreviewSrc }}" alt="Preview category image" />
        <input (change)="onSelectImage($event)" [required]="categoryID == null"
        class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400" aria-describedby="category_img" id="category_img" type="file">
        <p *ngIf="image.errors?.['required']" class="text-center justify-center text-red-400">
            Field is required. An image is useful to show category.
        </p>
    </div>
    
    <div class="text-center justify-content-center">
        <button type="button" (click)="cancel()"
        class="text-white w-36 bg-red-700 hover:bg-red-800 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-red-600 dark:hover:bg-red-700 focus:outline-none dark:focus:ring-red-800">Cancel</button>
        <button type="submit" [disabled]="categoryForm.invalid"
        class="text-white w-36 bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Save</button>
    </div>
</form>
