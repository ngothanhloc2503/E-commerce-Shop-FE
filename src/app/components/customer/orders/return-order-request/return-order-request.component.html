<div *ngIf="isVisible" id="return-order-request-modal" class="overflow-x-hidden overflow-y-auto fixed inset-0 z-50 outline-none focus:outline-none justify-center items-center flex">
    <div class="relative p-4 w-full max-w-2xl max-h-full">
        <!-- Modal content -->
        <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
            <!-- Modal header -->
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
                    Return Order ID #{{ orderId }}
                </h3>
                <button type="button" (click)="closeModal()"
                    class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>

            <!-- Modal body -->
            <div class="p-4 dark:text-white">
                <h3>Reason:</h3>
                <div class="flex flex-col">
                    <div class="flex flex-row">
                        <input type="radio" (change)="onSelectReason($event)" class="my-auto me-2" id="radioBoughtWrongItem" name="returnReason" value="I bought the wrong items"/>
                        <label for="radioWrongItem">I bought the wrong items</label>
                    </div>
                    <div class="flex flex-row">
                        <input type="radio" (change)="onSelectReason($event)" class="my-auto me-2" id="radioReceivedWrongItem" name="returnReason" value="I received the wrong items"/>
                        <label for="radioReceivedWrongItem">I received the wrong items</label>
                    </div>
                    <div class="flex flex-row">
                        <input type="radio" (change)="onSelectReason($event)" class="my-auto me-2" id="radioProductDamaged" name="returnReason" value="The product was damaged/defective"/>
                        <label for="radioProductDamaged">The product was damaged/defective</label>
                    </div>
                    <div class="flex flex-row mb-2">
                        <input type="radio" (change)="onSelectReason($event)" class="my-auto me-2" id="radioArrivedTooLate" name="returnReason" value="The product arrived too late"/>
                        <label for="radioArrivedTooLate">The product arrived too late</label>
                    </div>

                    <textarea class="text-gray-900" id="returnNote" rows="4" maxlength="120" placeholder="Additional information" [(ngModel)]="note" [ngModelOptions]="{standalone: true}"></textarea>
                </div>
            </div>

            <!-- Modal footer -->
            <div class="flex justify-end p-4 md:p-5 border-t border-gray-200 rounded-b dark:border-gray-600">
                <button (click)="closeModal()" type="button" class="py-2.5 px-5 text-sm font-medium text-white focus:outline-none bg-red-500 rounded-lg border border-gray-200 hover:bg-red-600 focus:z-10 focus:ring-4 focus:ring-red-600 dark:focus:ring-red-700 dark:bg-red-600 dark:border-gray-600 dark:hover:text-white dark:hover:bg-red-700">Cancel</button>
                <button (click)="sendReturnRequest()" type="button" class="text-white bg-green-600 hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300 dark:focus:ring-green-800 font-medium rounded-lg text-sm inline-flex items-center px-5 py-2.5 ms-3 text-center">Send Request</button>
            </div>
        </div>
    </div>
</div>
