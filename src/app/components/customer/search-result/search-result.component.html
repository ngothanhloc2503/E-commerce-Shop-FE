<div class="px-4">
    <div class="flex justify-between">
        <h2 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Result for "{{ keyword }}"</h2>
    </div>

    <div class="h-16 flex mt-4">
        <button type="button"
            class="text-xl font-semibold text-gray-900 dark:text-white h-full p-4 border border-2 rounded border-gray-900 dark:border-gray-600"
            (click)="showFilter = !showFilter">
            <i class="fa-solid fa-filter"></i>
            <span class="ps-2">Filter</span>
        </button>

        <button type="button"
            class="relative font-semibold text-gray-900 dark:text-white h-full mx-2 border border-2 rounded border-gray-900 dark:border-gray-600">
            <select (change)="sortProduct()" [(ngModel)]="sortField" class="peer p-4 pe-9 block w-full bg-white dark:bg-gray-800
            focus:ring-0 border-none
            [&:not(:placeholder-shown)]:pt-6
            [&:not(:placeholder-shown)]:pb-2">
                <option value="averageRating_DESC" selected>Highest Rate</option>
                <option value="reviewCount_DESC">Most Reviewed</option>
                <option value="price_ASC">Price: Low to High</option>
                <option value="price_DESC">Price: High to Low</option>
            </select>
            <label class="absolute top-0 start-0 p-4 h-full
            peer-[:not(:placeholder-shown)]:text-xs
            peer-[:not(:placeholder-shown)]:-translate-y-1.5">Sort By:</label>
        </button>
    </div>

    <div class="flex flex-row">
        <!-- Filter -->
        <div [hidden]="!showFilter" class="relative w-64 p-4 bg-white dark:bg-gray-800">
            <ul class="space-y-2 font-medium">
                <!-- Dropdown Rating -->
                <li>
                    <button type="button"
                        class="flex items-center w-full p-2 text-base text-gray-900 transition duration-75 rounded-lg group hover:bg-gray-100 dark:text-white dark:hover:bg-gray-700"
                        aria-controls="dropdown-rating" data-collapse-toggle="dropdown-rating">
                        <span class="flex-1 ms-3 text-left rtl:text-right whitespace-nowrap">Rating</span>
                        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 10 6">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m1 1 4 4 4-4" />
                        </svg>
                    </button>
                    <ul id="dropdown-rating" class="py-2 space-y-2">
                        <li>
                            <button type="button" (click)="changeRating(4.5)" [disabled]="rating == 4.5"
                                class="flex items-center w-full p-2 text-gray-900 transition duration-75 rounded-lg pl-10 group hover:bg-gray-100 dark:text-white dark:hover:bg-gray-700 disabled:bg-gray-700">
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-solid fa-star-half-stroke"></i>
                                <label class="inline-block">&nbsp;4.5 & up</label>
                            </button>
                        </li>
                        <li>
                            <button type="button" (click)="changeRating(4.0)" [disabled]="rating == 4.0"
                                class="flex items-center w-full p-2 text-gray-900 transition duration-75 rounded-lg pl-10 group hover:bg-gray-100 dark:text-white dark:hover:bg-gray-700 disabled:bg-gray-700">
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-regular fa-star"></i>
                                &nbsp;4.0 & up
                            </button>
                        </li>
                        <li>
                            <button type="button" (click)="changeRating(3.5)" [disabled]="rating == 3.5"
                                class="flex items-center w-full p-2 text-gray-900 transition duration-75 rounded-lg pl-10 group hover:bg-gray-100 dark:text-white dark:hover:bg-gray-700 disabled:bg-gray-700">
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-solid fa-star-half-stroke"></i>
                                <i class="text-yellow-400 fa-regular fa-star"></i>
                                &nbsp;3.5 & up
                            </button>
                        </li>
                        <li>
                            <button type="button" (click)="changeRating(3.0)" [disabled]="rating == 3.0"
                                class="flex items-center w-full p-2 text-gray-900 transition duration-75 rounded-lg pl-10 group hover:bg-gray-100 dark:text-white dark:hover:bg-gray-700 disabled:bg-gray-700">
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-regular fa-star"></i>
                                <i class="text-yellow-400 fa-regular fa-star"></i>
                                &nbsp;3.0 & up
                            </button>
                        </li>
                        <li>
                            <button type="button" (click)="changeRating(2.5)" [disabled]="rating == 2.5"
                                class="flex items-center w-full p-2 text-gray-900 transition duration-75 rounded-lg pl-10 group hover:bg-gray-100 dark:text-white dark:hover:bg-gray-700 disabled:bg-gray-700">
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-solid fa-star"></i>
                                <i class="text-yellow-400 fa-solid fa-star-half-stroke"></i>
                                <i class="text-yellow-400 fa-regular fa-star"></i>
                                <i class="text-yellow-400 fa-regular fa-star"></i>
                                &nbsp;2.5 & up
                            </button>
                        </li>
                        <li>
                            <button type="button" (click)="changeRating(0)" [disabled]="rating == 0"
                                class="flex items-center w-full p-2 text-gray-900 transition duration-75 rounded-lg pl-10 group hover:bg-gray-100 dark:text-white dark:hover:bg-gray-700 disabled:bg-gray-700">
                                All Rating
                            </button>
                        </li>
                    </ul>
                </li>

                <!-- Dropdown Brand -->
                <li>
                    <button type="button"
                        class="flex items-center w-full p-2 text-base text-gray-900 transition duration-75 rounded-lg group hover:bg-gray-100 dark:text-white dark:hover:bg-gray-700"
                        aria-controls="dropdown-brand" data-collapse-toggle="dropdown-brand">
                        <span class="flex-1 ms-3 text-left rtl:text-right whitespace-nowrap">Brand</span>
                        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 10 6">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m1 1 4 4 4-4" />
                        </svg>
                    </button>

                    <ul id="dropdown-brand" class="py-2 space-y-2">
                        <li *ngFor="let brand of listRecommendedBrands" class="text-gray-900 dark:text-white dark:hover:bg-gray-700 py-2 rounded-lg">
                            <input type="checkbox" id="{{brand.id}}" name="brand" value="{{brand.id}}"class="items-center ms-10 checked:bg-blue-500 focus:ring-0" (change)="updateBrandIDs()">
                            <label class="ps-4">{{ brand.name }}</label>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>

        <!-- Product List -->
        <div class="flex-1">
            <div class="grid md:grid-cols-3 lg:grid-cols-5 gap-4 py-4">
                <div *ngFor="let product of listProduct"
                    class="w-full max-w-sm bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700">
                    <a [href]="'/products/' + product.alias" class="h-[250px] md:h-[300px] lg:h-[350px]">
                        <img class="h-[200px] md:h-[250px] lg:h-[300px] w-full rounded-lg"
                            src="{{ product.mainImagePath }}" alt="{{ product.name }}">
                    </a>
                    <div class="px-5 pb-5">
                        <a [href]="'/products/' + product.alias" title="{{ product.name }}" class="h-[80px]">
                            <h5
                                class="sm:text-base md:text-lg font-semibold tracking-tight text-gray-900 dark:text-white">
                                {{ getShortName(product.name) }}</h5>
                        </a>
                        <div class="flex items-center mt-2.5 mb-5">
                            <div class="flex items-center space-x-1 rtl:space-x-reverse">
                                <svg class="w-4 h-4 text-yellow-300" aria-hidden="true"
                                    xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 22 20">
                                    <path
                                        d="M20.924 7.625a1.523 1.523 0 0 0-1.238-1.044l-5.051-.734-2.259-4.577a1.534 1.534 0 0 0-2.752 0L7.365 5.847l-5.051.734A1.535 1.535 0 0 0 1.463 9.2l3.656 3.563-.863 5.031a1.532 1.532 0 0 0 2.226 1.616L11 17.033l4.518 2.375a1.534 1.534 0 0 0 2.226-1.617l-.863-5.03L20.537 9.2a1.523 1.523 0 0 0 .387-1.575Z" />
                                </svg>
                            </div>
                            <span
                                class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded dark:bg-blue-200 dark:text-blue-800 ms-3">{{
                                product.averageRating }}</span>
                        </div>
                        <div class="flex items-center justify-between sm:text-base md:text-lg lg:text-xl font-bold text-gray-900 dark:text-white">
                            <div *ngIf="product.discountPercent > 0">
                                <span>
                                    {{ settingService.getFormatMoney(product.discountPrice) }}
                                </span>
                                <span *ngIf="product.discountPercent > 0" class="text-sm font-medium text-red-900">
                                    (-{{ product.discountPercent }}%)
                                </span>
                            </div>
                            <div *ngIf="product.discountPercent <= 0">
                                <span>
                                    {{ settingService.getFormatMoney(product.price) }}
                                </span>
                            </div>
                            <button type="button" (click)="cartService.addProductToCart(product.id, 1)"
                                class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                                <i class="fa-solid fa-xl fa-cart-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <ul *ngIf="totalPages > 0"
                class="flex items-center justify-center mx-auto -space-x-px rtl:space-x-reverse text-base h-8">
                <li>
                    <button type="button" (click)="goToPage(1)" [class]="pageNum > 1 ? '' : 'disabled'" title="First"
                        class="flex items-center justify-center px-3 h-8 ms-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-s-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
                        <span class="sr-only">First</span>
                        <i class="fa-solid fa-angles-left"></i>
                    </button>
                </li>
                <li>
                    <button type="button" (click)="goToPage(pageNum - 1)" [class]="pageNum > 1 ? '' : 'disabled'"
                        title="Previous"
                        class="flex items-center justify-center px-3 h-8 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
                        <span class="sr-only">Previous</span>
                        <i class="fa-solid fa-angle-left"></i>
                    </button>
                </li>
                <li *ngIf="pageNum > 3">
                    <button type="button" title="Previous"
                        class="flex items-center justify-center px-3 h-8 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
                        disabled>...</button>
                </li>
                <li *ngFor="let pageNumber of [].constructor(totalPages); let i = index">
                    <button type="button" *ngIf="i + 1 != pageNum && pageNum - 4 < i && i < pageNum + 2"
                        (click)="goToPage(i + 1)"
                        class="flex items-center justify-center px-3 h-8 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">{{
                        i + 1 }}</button>
                    <button type="button" *ngIf="i + 1 == pageNum" aria-current="page"
                        class="flex items-center justify-center px-3 h-8 text-blue-600 border border-gray-300 bg-blue-50 hover:bg-blue-100 hover:text-blue-700 dark:border-gray-700 dark:bg-gray-700 dark:text-white"
                        disabled>{{i + 1}}</button>
                </li>
                <li *ngIf="pageNum + 2 < totalPages">
                    <button type="button" title="Previous"
                        class="flex items-center justify-center px-3 h-8 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
                        disabled>...</button>
                </li>
                <li>
                    <button type="button" (click)="goToPage(pageNum + 1)"
                        [class]="pageNum < totalPages ? '' : 'disabled'" title="Next"
                        class="flex items-center justify-center px-3 h-8 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
                        <span class="sr-only">Next</span>
                        <i class="fa-solid fa-angle-right"></i>
                    </button>
                </li>
                <li>
                    <button type="button" (click)="goToPage(totalPages)"
                        [class]="pageNum < totalPages ? '' : 'disabled'" title="Last"
                        class="flex items-center justify-center px-3 h-8 leading-tight text-gray-500 bg-white border border-gray-300 rounded-e-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
                        <span class="sr-only">Last</span>
                        <i class="fa-solid fa-angles-right"></i>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</div>
