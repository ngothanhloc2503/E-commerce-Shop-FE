<div class="fixed bottom-5 right-5 flex max-w-sm w-full bg-white shadow-md rounded-lg overflow-hidden mx-auto dark:bg-gray-800" [class]="buttonBgColor">
  <div class='w-2' [class]="'bg-' + color + '-800'"></div>

  <div class='flex items-center px-2 py-3'>
      <div class='mx-3 text-sm font-medium'>
        {{ message }}
      </div>
  </div>
  <button type="button" (click)="alertService.isShowAlert = false"
      class="ms-auto rounded-lg focus:ring-2 px-2 py-3 inline-flex items-center justify-center w-8 dark:bg-gray-800 dark:hover:bg-gray-700" [class]="buttonBgColor" aria-label="Close">
      <span class="sr-only">Close</span>
      <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
      </svg>
  </button>
</div>
